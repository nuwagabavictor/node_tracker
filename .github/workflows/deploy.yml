name: Build and Deploy Restart Finance API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Build
      - name: Build Project
        run: npm run build

      - name: Clean old build on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/restart.com/backend
            rm -rf dist

      # 5. Upload application files
      - name: Copy Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist,package.json,package-lock.json,ecosystem.config.js"
          target: "/var/www/restart.com/backend"

      # 6. Install production dependencies and restart
      - name: Deploy and Restart Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/restart.com/backend

            echo "Installing production dependencies..."
            npm ci --omit=dev
            
            echo "Running database migrations..."
            npm run migration:run:prod

            echo "Restarting PM2..."
            pm2 reload ecosystem.config.js --update-env || \
            pm2 start ecosystem.config.js

            pm2 save

            echo "Application status:"
            pm2 status