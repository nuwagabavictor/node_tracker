name: Restart Finance Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      - name: Clean Workspace
        run: |
          git reset --hard || true
          git clean -fd || true

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Show Latest Commit
        run: |
          git log -1

      - name: Install Dependencies
        run: |
          npm ci

      - name: Build Application
        run: |
          npm run build

      - name: Remove Dev Dependencies
        run: |
          npm prune --omit=dev

      - name: Deploy to Production
        run: |
          DEPLOY_DIR="/home/victor/restart-finance"

          mkdir -p "$DEPLOY_DIR"

          rsync -a --delete \
            --exclude=".env" \
            "$GITHUB_WORKSPACE/" \
            "$DEPLOY_DIR/"

      - name: Restart Application
        run: |
          cd /home/victor/restart-finance

          pm2 reload ecosystem.config.js --update-env || \
          pm2 start ecosystem.config.js

          pm2 save

          pm2 status